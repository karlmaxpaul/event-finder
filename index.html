<!DOCTYPE html>
<html>

<head>
<title>Event Finder</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6dd5ed,#2193b0);
text-align:center;
margin:0;
padding:20px;
}

h1{
color:white;
padding:20px;
}

#search{
width:60%;
padding:12px;
border-radius:20px;
border:none;
margin:10px;
}

button{
padding:10px 16px;
border:none;
border-radius:20px;
background:#ff6b3d;
color:white;
cursor:pointer;
margin:5px;
font-size:14px;
}

button:hover{
background:#ff3c00;
}

.event{
background:white;
margin:15px auto;
padding:15px;
border-radius:12px;
width:70%;
box-shadow:0 5px 10px rgba(0,0,0,0.2);
text-align:left;
}

.event h3{
margin:10px 0;
color:#333;
}

.event-details{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:10px 0;
}

.event-detail-item{
text-align:center;
padding:10px;
background:#f5f5f5;
border-radius:8px;
}

.event-actions{
display:flex;
gap:10px;
justify-content:center;
margin-top:15px;
flex-wrap:wrap;
}

.reminder-section{
background:#fffacd;
padding:10px;
margin:10px 0;
border-radius:8px;
border-left:4px solid #ff6b3d;
}

.reminder-section label{
font-weight:bold;
color:#333;
}

.reminder-section input{
padding:8px;
margin:5px;
border-radius:6px;
border:1px solid #ccc;
width:150px;
}

.reminder-btn{
background:#ff9800;
padding:8px 15px;
font-size:12px;
}

.reminder-btn:hover{
background:#e68900;
}

form{
background:white;
padding:20px;
margin:20px auto;
width:70%;
border-radius:12px;
}

input,select,textarea{
padding:10px;
margin:8px;
border-radius:8px;
border:1px solid #ccc;
width:90%;
box-sizing:border-box;
}

textarea{
resize:vertical;
min-height:80px;
font-family:Arial;
}

.delete{
background:red;
}

.delete:hover{
background:#cc0000;
}

.edit{
background:#4CAF50;
}

.edit:hover{
background:#45a049;
}

.modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background-color:rgba(0,0,0,0.4);
}

.modal-content{
background-color:#fefefe;
margin:10% auto;
padding:20px;
border:1px solid #888;
width:70%;
border-radius:12px;
max-height:80vh;
overflow-y:auto;
}

.close{
color:#aaa;
float:right;
font-size:28px;
font-weight:bold;
cursor:pointer;
}

.close:hover{
color:#000;
}

.stats{
background:white;
padding:15px;
margin:20px auto;
width:70%;
border-radius:12px;
display:grid;
grid-template-columns:1fr 1fr 1fr 1fr;
gap:10px;
}

.stat-box{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:15px;
border-radius:8px;
}

.stat-number{
font-size:24px;
font-weight:bold;
}

.stat-label{
font-size:12px;
margin-top:5px;
}

.filter-section{
margin:20px 0;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.sort-section{
margin:20px 0;
display:flex;
justify-content:center;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

.export-btn{
background:#2196F3;
}

.export-btn:hover{
background:#0b7dda;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#333;
color:white;
padding:15px 20px;
border-radius:8px;
box-shadow:0 4px 6px rgba(0,0,0,0.3);
z-index:2000;
animation:slideIn 0.5s ease-in-out;
max-width:300px;
}

.toast.success{
background:#4CAF50;
}

.toast.error{
background:#f44336;
}

.toast.info{
background:#2196F3;
}

@keyframes slideIn{
from{
transform:translateX(400px);
opacity:0;
}
to{
transform:translateX(0);
opacity:1;
}
}

.notification-status{
display:inline-block;
padding:5px 10px;
border-radius:5px;
font-size:11px;
margin:5px;
}

.notification-status.active{
background:#4CAF50;
color:white;
}

.notification-status.pending{
background:#ff9800;
color:white;
}

.notification-status.inactive{
background:#ccc;
color:#666;
}

@media (max-width:768px){
.event{
width:90%;
}

form{
width:90%;
}

.stats{
grid-template-columns:1fr 1fr;
width:90%;
}

.modal-content{
width:90%;
margin:20% auto;
}

#search{
width:80%;
}

.reminder-section input{
width:120px;
}
}

</style>

</head>

<body>

<h1>🎉 Event Finder</h1>

<input type="text" id="search" placeholder="Search events..." onkeyup="searchEvents()">

<div class="filter-section">
<button onclick="filterCategory('All')">All</button>
<button onclick="filterCategory('Music')">🎵 Music</button>
<button onclick="filterCategory('Sports')">⚽ Sports</button>
<button onclick="filterCategory('Tech')">💻 Tech</button>
<button onclick="filterCategory('Community')">👥 Community</button>
</div>

<div class="sort-section">
<label for="sortBy">Sort by:</label>
<select id="sortBy" onchange="handleSort()">
<option value="date-asc">Date (Earliest First)</option>
<option value="date-desc">Date (Latest First)</option>
<option value="name">Name (A-Z)</option>
</select>
<button class="export-btn" onclick="exportEvents()">📥 Export Events</button>
<button class="export-btn" onclick="importEvents()">📤 Import Events</button>
<button class="export-btn" onclick="toggleNotifications()">🔔 <span id="notifStatus">Enable</span> Notifications</button>
</div>

<div class="stats" id="stats"></div>

<form onsubmit="addEvent(event)" id="eventForm">
<h3>Add Event</h3>

<input type="text" id="name" placeholder="Event Name" required>

<input type="date" id="date" required>

<input type="time" id="time" placeholder="Event Time">

<input type="text" id="location" placeholder="Location" required>

<textarea id="description" placeholder="Event Description (optional)"></textarea>

<select id="category">
<option value="Music">🎵 Music</option>
<option value="Sports">⚽ Sports</option>
<option value="Tech">💻 Tech</option>
<option value="Community">👥 Community</option>
</select>

<br>

<button type="submit">Add Event</button>
<button type="reset" onclick="resetForm()">Clear</button>

</form>

<div id="events"></div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeEditModal()">&times;</span>
<h2>Edit Event</h2>
<form onsubmit="updateEvent(event)" id="editForm">

<input type="text" id="editName" placeholder="Event Name" required>

<input type="date" id="editDate" required>

<input type="time" id="editTime" placeholder="Event Time">

<input type="text" id="editLocation" placeholder="Location" required>

<textarea id="editDescription" placeholder="Event Description (optional)"></textarea>

<select id="editCategory">
<option value="Music">🎵 Music</option>
<option value="Sports">⚽ Sports</option>
<option value="Tech">💻 Tech</option>
<option value="Community">👥 Community</option>
</select>

<br>

<button type="submit">Save Changes</button>
<button type="button" onclick="closeEditModal()">Cancel</button>

</form>
</div>
</div>

<input type="file" id="fileInput" style="display:none" accept=".json" onchange="handleFileImport()">

<script>

/* Global notification state */
let notificationsEnabled = localStorage.getItem("notificationsEnabled") === "true";
let scheduledNotifications = {};
let notificationCheckInterval = null;

/* ask permission for notifications */

if ("Notification" in window && notificationsEnabled){
Notification.requestPermission();
}

/* show system notification */

function showNotification(title,message){

if(Notification.permission==="granted" && notificationsEnabled){

new Notification(title,{
body:message,
icon:"https://cdn-icons-png.flaticon.com/512/1827/1827349.png"
});

}

}

/* show in-app toast notification */

function showToast(message, type = 'info'){

const toast = document.createElement('div');

toast.className = 'toast ' + type;

toast.textContent = message;

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},3000);

}

/* load saved events */

let events = JSON.parse(localStorage.getItem("events")) || [

{ id:1, name:"Music Festival",date:"2026-05-10",time:"18:00",category:"Music",location:"City Park",description:"Annual music festival with live performances",reminderSet:false,reminderTime:null,notified:false },

{ id:2, name:"Tech Meetup",date:"2026-05-12",time:"19:00",category:"Tech",location:"Innovation Hub",description:"Network with tech enthusiasts",reminderSet:false,reminderTime:null,notified:false }

];

let currentSort = "date-asc";
let editingId = null;

function generateId(){
return Math.max(...events.map(e=>e.id||0),0)+1;
}

function saveEvents(){

localStorage.setItem("events",JSON.stringify(events));

}

function toggleNotifications(){

notificationsEnabled = !notificationsEnabled;

localStorage.setItem("notificationsEnabled", notificationsEnabled);

if(notificationsEnabled){

Notification.requestPermission().then(permission=>{

if(permission==="granted"){

showToast("✅ Notifications enabled!", "success");

startNotificationChecker();

}

else{

notificationsEnabled = false;

localStorage.setItem("notificationsEnabled", false);

showToast("⚠️ Notification permission denied", "error");

}

});

}

else{

stopNotificationChecker();

showToast("❌ Notifications disabled", "info");

}

updateNotificationStatus();

}

function updateNotificationStatus(){

const status = document.getElementById("notifStatus");

status.textContent = notificationsEnabled ? "Disable" : "Enable";

}

function displayEvents(data){

const container=document.getElementById("events");

container.innerHTML="";

if(data.length===0){
container.innerHTML="<p style='color:white;font-size:18px;margin:20px;'>No events found. Create one to get started! 🎯</p>";
return;
}

data.forEach((event)=>{

const timeDisplay = event.time ? `⏰ ${event.time}` : "⏰ No time set";

const reminderStatus = event.reminderSet ? 
`<span class="notification-status active">🔔 Reminder Set for ${event.reminderTime}</span>` : 
`<span class="notification-status inactive">🔔 No Reminder</span>`;

container.innerHTML+=`

<div class="event">

<h3>${event.name}</h3>

<div class="event-details">
<div class="event-detail-item">
<strong>📅 Date</strong><br>${event.date}
</div>
<div class="event-detail-item">
<strong>${timeDisplay}</strong>
</div>
<div class="event-detail-item">
<strong>📍 Location</strong><br>${event.location}
</div>
<div class="event-detail-item">
<strong>🏷 Category</strong><br>${event.category}
</div>
</div>

${event.description ? `<p><strong>Description:</strong> ${event.description}</p>` : ""}

<div class="reminder-section">
<label>⏰ Set Reminder:</label><br>
<input type="date" id="reminderDate_${event.id}" value="${event.date}">
<input type="time" id="reminderTime_${event.id}" value="${event.reminderTime || event.time || '09:00'}">
<button class="reminder-btn" type="button" onclick="setEventReminder(${event.id})">📬 Set Reminder</button>
${reminderStatus}
</div>

<div class="event-actions">
<button class="edit" onclick="openEditModal(${event.id})">✏️ Edit</button>
<button class="delete" onclick="deleteEvent(${event.id})">🗑️ Delete</button>
</div>

</div>

`;

});

}

function searchEvents(){

const search=document.getElementById("search").value.toLowerCase();

const filtered=events.filter(e=>
e.name.toLowerCase().includes(search) ||
(e.description && e.description.toLowerCase().includes(search)) ||
e.location.toLowerCase().includes(search)
);

displayEvents(sortEvents(filtered));

}

function filterCategory(category){

if(category==="All"){

displayEvents(sortEvents(events));

}

else{

const filtered=events.filter(e=>e.category===category);

displayEvents(sortEvents(filtered));

}

}

function sortEvents(data){

let sorted = [...data];

switch(currentSort){
case "date-asc":
sorted.sort((a,b)=>new Date(a.date) - new Date(b.date));
break;
case "date-desc":
sorted.sort((a,b)=>new Date(b.date) - new Date(a.date));
break;
case "name":
sorted.sort((a,b)=>a.name.localeCompare(b.name));
break;
}

return sorted;

}

function handleSort(){

currentSort = document.getElementById("sortBy").value;

displayEvents(sortEvents(events));

}

function setEventReminder(eventId){

const event = events.find(e=>e.id===eventId);

if(!event) return;

const reminderDate = document.getElementById(`reminderDate_${eventId}`).value;

const reminderTime = document.getElementById(`reminderTime_${eventId}`).value;

if(!reminderDate || !reminderTime){

showToast("❌ Please set both date and time", "error");

return;

}

event.reminderSet = true;

event.reminderTime = reminderTime;

event.date = reminderDate;

event.notified = false;

saveEvents();

displayEvents(sortEvents(events));

showToast(`✅ Reminder set for ${reminderDate} at ${reminderTime}`, "success");

if(notificationsEnabled){

startNotificationChecker();

}

}

function startNotificationChecker(){

if(notificationCheckInterval) return;

notificationCheckInterval = setInterval(checkReminders, 30000); // Check every 30 seconds

checkReminders(); // Check immediately

}

function stopNotificationChecker(){

if(notificationCheckInterval){

clearInterval(notificationCheckInterval);

notificationCheckInterval = null;

}

}

function checkReminders(){

if(!notificationsEnabled) return;

const now = new Date();

events.forEach(event=>{

if(!event.reminderSet || event.notified) return;

if(event.date && event.reminderTime){

const reminderDateTime = new Date(`${event.date}T${event.reminderTime}`);

const timeDiff = reminderDateTime - now;

// Trigger notification if within 2 minutes before or at reminder time

if(timeDiff >= -120000 && timeDiff <= 120000){

event.notified = true;

saveEvents();

showNotification(
`🎉 Reminder: ${event.name}`,
`📅 ${event.date} at ${event.reminderTime}\n📍 ${event.location}`
);

showToast(`⏰ Reminder: ${event.name} is happening soon!`, "success");

}

}

});

}

function addEvent(e){

e.preventDefault();

const newEvent={

id:generateId(),

name:document.getElementById("name").value,

date:document.getElementById("date").value,

time:document.getElementById("time").value,

location:document.getElementById("location").value,

category:document.getElementById("category").value,

description:document.getElementById("description").value,

reminderSet:false,

reminderTime:null,

notified:false

};

events.push(newEvent);

saveEvents();

displayEvents(sortEvents(events));

updateStats();

showNotification("New Event Added",newEvent.name+" on "+newEvent.date);

showToast(`✅ Event "${newEvent.name}" added!`, "success");

document.getElementById("eventForm").reset();

}

function deleteEvent(id){

const event = events.find(e=>e.id===id);

if(confirm("Are you sure you want to delete this event?")){

events = events.filter(e=>e.id!==id);

saveEvents();

displayEvents(sortEvents(events));

updateStats();

showToast(`❌ Event "${event.name}" deleted`, "info");

}

}

function openEditModal(id){

const event = events.find(e=>e.id===id);

if(event){

editingId = id;

document.getElementById("editName").value = event.name;

document.getElementById("editDate").value = event.date;

document.getElementById("editTime").value = event.time||"";

document.getElementById("editLocation").value = event.location;

document.getElementById("editDescription").value = event.description||"";

document.getElementById("editCategory").value = event.category;

document.getElementById("editModal").style.display = "block";

}

}

function closeEditModal(){

document.getElementById("editModal").style.display = "none";

editingId = null;

}

function updateEvent(e){

e.preventDefault();

const eventIndex = events.findIndex(ev=>ev.id===editingId);

if(eventIndex > -1){

events[eventIndex] = {

id:editingId,

name:document.getElementById("editName").value,

date:document.getElementById("editDate").value,

time:document.getElementById("editTime").value,

location:document.getElementById("editLocation").value,

category:document.getElementById("editCategory").value,

description:document.getElementById("editDescription").value,

reminderSet:events[eventIndex].reminderSet,

reminderTime:events[eventIndex].reminderTime,

notified:events[eventIndex].notified

};

saveEvents();

displayEvents(sortEvents(events));

updateStats();

closeEditModal();

showNotification("Event Updated",events[eventIndex].name+" has been updated");

showToast(`✅ Event "${events[eventIndex].name}" updated!`, "success");

}

}

function updateStats(){

const statsContainer = document.getElementById("stats");

const totalEvents = events.length;

const categories = [...new Set(events.map(e=>e.category))].length;

const upcomingEvents = events.filter(e=>new Date(e.date) >= new Date()).length;

const remindersSet = events.filter(e=>e.reminderSet).length;

statsContainer.innerHTML = `

<div class="stat-box">

<div class="stat-number">${totalEvents}</div>

<div class="stat-label">Total Events</div>

</div>

<div class="stat-box">

<div class="stat-number">${categories}</div>

<div class="stat-label">Categories</div>

</div>

<div class="stat-box">

<div class="stat-number">${upcomingEvents}</div>

<div class="stat-label">Upcoming</div>

</div>

<div class="stat-box">

<div class="stat-number">${remindersSet}</div>

<div class="stat-label">Reminders Set</div>

</div>

`;

}

function exportEvents(){

const dataStr = JSON.stringify(events, null, 2);

const dataBlob = new Blob([dataStr], {type: "application/json"});

const url = URL.createObjectURL(dataBlob);

const link = document.createElement("a");

link.href = url;

link.download = "events-" + new Date().toISOString().split('T')[0] + ".json";

link.click();

showToast("📥 Events exported successfully!", "success");

}

function importEvents(){

document.getElementById("fileInput").click();

}

function handleFileImport(){

const file = document.getElementById("fileInput").files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

try{

const importedEvents = JSON.parse(e.target.result);

if(Array.isArray(importedEvents)){

const confirmImport = confirm("This will merge with existing events. Continue?");

if(confirmImport){

events = [...events,...importedEvents];

saveEvents();

displayEvents(sortEvents(events));

updateStats();

showNotification("Events Imported","Successfully imported "+importedEvents.length+" events");

showToast(`📤 Successfully imported ${importedEvents.length} events!`, "success");

}

}

else{

alert("Invalid file format. Please use a JSON file exported from Event Finder.");

}

}

catch(error){

alert("Error reading file: "+error.message);

}

};

reader.readAsText(file);

}

}

function resetForm(){

document.getElementById("eventForm").reset();

}

window.onclick = function(event){

const modal = document.getElementById("editModal");

if(event.target===modal){

closeEditModal();

}

}

/* Initialize */

updateNotificationStatus();

if(notificationsEnabled){

startNotificationChecker();

}

displayEvents(sortEvents(events));

updateStats();

</script>

</body>

</html>
